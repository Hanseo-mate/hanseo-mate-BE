spring.application.name=hanseomate
spring.profiles.default=local
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Expose only non-sensitive actuator endpoints.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Domain services validate their own file limits. Multipart itself has no aggregate limit.
course-import.max-upload-bytes=10485760
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-part-count=-1
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:http://localhost:8080}
app.upload.max-image-bytes=${UPLOAD_MAX_IMAGE_BYTES:5242880}
app.attachment-storage.directory=${NOTICE_ATTACHMENT_DIRECTORY:private-uploads/student-council-notices}
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:https://api.hanseomate.local}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
