
name: Deploy Test Server

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hanseo-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, hanseo-test]
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply test-only scheduler setting
        run: |
          FILE=src/main/java/hsu/hanseomate/domain/cafeteria/service/CafeteriaScheduler.java
          test -f "$FILE"
          if ! grep -Fq 'Profile("!test")' "$FILE"; then
            sed -i '/^@Component$/i @org.springframework.context.annotation.Profile("!test")' "$FILE"
          fi
          grep -Fq 'Profile("!test")' "$FILE"

      - name: Build Spring Boot
        run: bash ./gradlew clean bootJar -x test --no-daemon

      - name: Prepare deployment JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f \
            -name '*.jar' ! -name '*plain.jar' -print -quit)
          test -n "$JAR"
          install -m 600 "$JAR" /var/lib/hanseo-test-deploy/app-test.jar

      - name: Prepare SQL migrations
        run: |
          DIR=/var/lib/hanseo-test-deploy/migrations
          find "$DIR" -maxdepth 1 -type f -name '*.sql' -delete
          if [ -d db/migrations ]; then
            find db/migrations -maxdepth 1 -type f \
              -name '*.sql' -exec cp -t "$DIR" {} +
          fi

      - name: Migrate test database
        run: sudo -n /usr/local/sbin/migrate-hanseo-test

      - name: Deploy test application
        run: sudo -n /usr/local/sbin/deploy-hanseo-test
